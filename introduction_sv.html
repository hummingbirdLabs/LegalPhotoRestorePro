<header><div class="hero"><div class="hero-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 12 Q12 8 16 11 Q12 16 8 12Z"/></svg>PhotoRestore Pro</div><h1>Restauracja zdjęć AI,<br><span>Całkowicie offline na Windows</span></h1><p class="hero-sub">Kompletne studio ulepszania zdjęć AI dla Windows. Naprawiaj stare zdjęcia, skaluj do 4K, dodawaj kolor do obrazów czarno-białych, usuwaj rysy i więcej — wszystko przetwarzane lokalnie bez przesyłania danych.</p><div class="hero-meta"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8.5v8.5H3zm9.5 0H21v8.5h-8.5zM3 12.5h8.5V21H3zm9.5 0H21V21h-8.5z"/></svg>Windows 10 / 11</span><span>·</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>ONNX Runtime</span><span>·</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>100% Offline</span><span>·</span><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>7 języków</span></div><div class="download-btn-container"><a href="https://apps.microsoft.com/detail/9N3P5FLW85X8" class="download-btn" target="_blank" rel="noopener noreferrer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>Hämta från Microsoft Store</a></div><div style="display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin-top:20px;"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg-subtle);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>Microsoft Store Certified</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg-subtle);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Zaufany na całym świecie</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--fg-subtle);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 14px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>UI 7-języczny</span></div></div></header>
<section class="screenshots-section"><div class="container"><div class="section-label"><span class="overline">I aktion</span><h2>Se själv</h2><p>Ett intuitivt, smidigt gränssnitt som gör AI-driven fotorestaurering enkel.
<section><div class="container" style="text-align:center;"><span class="overline">Hur det fungerar</span><div class="divider"></div><h2 style="font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800;letter-spacing:-.025em;margin-bottom:12px;">Tre steg. Inga komplicerade inställningar.</h2><p style="color:var(--fg-muted);max-width:540px;margin:0 auto 40px;">Välj ett verktyg, ladda din bild, klicka på Start — AI-motorn körs helt på din enhet. Ingen molntjänst, inget konto, ingen väntan på uppladdningar.
<section style="padding-top:0;"><div class="container"><div class="section-label" style="text-align:center;"><span class="overline">Vem detta är för</span><div class="divider"></div><h2 style="font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800;letter-spacing:-.025em;margin-bottom:12px;">Skapat för alla som bryr sig om sina foton</h2><p style="color:var(--fg-muted);max-width:540px;margin:0 auto;">Od cennych wspomnień rodzinnych po profesjonalne rezultaty — jeśli pracujesz ze zdjęciami, PhotoRestore Pro pasuje do Twojego przepływu pracy.</p></div><div class="features-grid" style="grid-template-columns:repeat(2,1fr);margin-top:32px;"><div class="feature-card"><div class="feature-icon icon-amber" style="margin:0 auto 16px;">&#x1F3E0;</div><h3>Familjehistoriker</h3><p>Przywróć wyblakłe zdjęcia ślubne, pokoloruj czarno-białe portrety sprzed dziesięcioleci i napraw pogniecione odbitki — bez wysyłania cennych wspomnień do chmury.</p><p style="font-size:12px;color:var(--fg-subtle);margin-top:8px;">"Przywróciłem zdjęcie ślubne moich dziadków z 1942 roku." — Sarah M., Oregon</p></div><div class="feature-card"><div class="feature-icon icon-purple" style="margin:0 auto 16px;">&#x1F4F8;</div><h3>Professionella fotografer</h3><p>Skaluj rezultaty dla klientów do 4K, dodawaj znaki wodne wsadowo i poprawiaj kolory za pomocą jednego kliknięcia — wszystko offline dla poufności klienta.</p><p style="font-size:12px;color:var(--fg-subtle);margin-top:8px;">"Dorównuje jakości usług chmurowych." — David K., Londyn</p></div><div class="feature-card"><div class="feature-icon icon-teal" style="margin:0 auto 16px;">&#x1F6CD;</div><h3>E-handelsägare</h3><p>Dodawaj znaki wodne wsadowo do 50 zdjęć produktów naraz, zmieniaj rozmiar dla sieci i konwertuj formaty — wszystko w jednym narzędziu offline bez opłat abonamentowych.</p><p style="font-size:12px;color:var(--fg-subtle);margin-top:8px;">"50 zdjęć ze znakiem wodnym w mniej niż minutę." — Anna R., Berlin</p></div><div class="feature-card"><div class="feature-icon icon-blue" style="margin:0 auto 16px;">&#x1F3DB;</div><h3>Arkivarier och museer</h3><p>Tryb klasycznej restauracji zachowuje oryginalną rozdzielczość dla skanów archiwalnych. Algorytmy deterministyczne zapewniają powtarzalne wyniki dla dokumentacji.</p><p style="font-size:12px;color:var(--fg-subtle);margin-top:8px;">"Zachowuje oryginalną rozdzielczość — bez artefaktów AI."</p></div></div></div></section>
<section><div class="container"><div class="section-label" style="text-align:center;"><span class="overline">Funktioner</span><div class="divider"></div><h2>Åtta kraftfulla verktyg, en app</h2><p>Od wyblakłych zdjęć rodzinnych po ujęcia o niskiej rozdzielczości — PhotoRestore Pro obejmuje każdy scenariusz restauracji.</p></div><div class="features-grid"><div class="feature-card"><div class="feature-icon icon-amber">🗃️</div><h3>Restauracja starych zdjęć <span class="ai-pill">AI</span></h3><p>Przywróć do życia mocno postarzałe lub wyblakłe zdjęcia. Pełny potok AI — odszumianie, poprawa kolorów i skalowanie 4× — stosowane sekwencyjnie dla najwyższej możliwej jakości.</p></div><div class="feature-card"><div class="feature-icon icon-orange">⚡</div><h3>Szybka restauracja starych zdjęć</h3><p>Natychmiast oczyść lekko postarzałe zdjęcia używając tylko tradycyjnych algorytmów. Bez czasu oczekiwania AI — wyniki pojawiają się w milisekundach.</p></div><div class="feature-card"><div class="feature-icon icon-blue">🔍</div><h3>Skalowanie zdjęć 4× <span class="ai-pill">AI</span></h3><p>Powiększ dowolne zdjęcie do czterokrotności oryginalnej rozdzielczości używając modelu Real-ESRGAN. Odzyskuje ostre szczegóły ze skompresowanych obrazów.</p></div><div class="feature-card"><div class="feature-icon icon-purple">🎨</div><h3>Koloryzacja AI <span class="ai-pill">AI</span></h3><p>Przekształć czarno-białe fotografie w naturalne, żywe kolorowe obrazy. Model AI analizuje kontekst sPriser, aby stworzyć prawdopodobne, realistyczne kolory.</p></div><div class="feature-card"><div class="feature-icon icon-green">✨</div><h3>Poprawa kolorów</h3><p>Wybierz spośród ośmiu różnych presetów wizualnych — od Natural &amp; Crisp do Cinematic Film — aby natychmiast poprawić kontrast, nasycenie i ciepło.</p></div><div class="feature-card"><div class="feature-icon icon-teal">🔧</div><h3>Naprawa rys i zagięć</h3><p>Wykrywaj i usuwaj fizyczne rysy i linie zagięcia ze zeskanowanych zdjęć używając inpaintingu morfologicznego.</p></div><div class="feature-card"><div class="feature-icon icon-indigo">🎞️</div><h3>Siatka 9 filtrów stylu</h3><p>Podgląd dziewięciu filtrów artystycznych obok siebie w przewijanej liście miniatur i wybierz swój ulubiony. Filtry obejmują Czarno-biały, Vintage Warm, Cool Teal, Film Grain i więcej.</p></div><div class="feature-card"><div class="feature-icon icon-rose">✂️</div><h3>Przytnij i konwertuj</h3><p>Przytnij zdjęcia z precyzją używając presetów proporcji lub swobodnego wyboru, a następnie eksportuj do PNG, JPEG, BMP lub TIFF.</p></div><div class="feature-card"><div class="feature-icon icon-amber">💧</div><h3>Znak wodny wsadowo</h3><p>Zastosuj znaki wodne tekstowe lub obrazkowe do maksymalnie 50 zdjęć naraz. Skonfiguruj pozycję, przezroczystość, rozmiar i obrót, a następnie eksportuj całą partię w jednej operacji.</p></div></div></div></section>

<section><div class="container" style="text-align:center;"><span class="overline">Priser</span><div class="divider"></div><h2 style="font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800;letter-spacing:-.025em;margin-bottom:12px;">Prova gratis, köp en gång</h2><p style="color:var(--fg-muted);max-width:500px;margin:0 auto 28px;">Pobierz darmową wersję testową z Microsoft Store — poznaj wszystkie Funktioner bez limitu czasu na podstawowych narzędziach. Kup licencję, gdy będziesz gotowy.</p><div class="features-grid" style="grid-template-columns:repeat(2,1fr);"><div class="feature-card" style="text-align:center;"><div class="feature-icon icon-green" style="margin:0 auto 16px;">&#x2714;</div><h3>Testversion</h3><p>Pełny dostęp do wszystkich funkcji. Ograniczone przetwarzanie AI na sesję. Bez karty kredytowej, Inget konto.</p></div><div class="feature-card" style="text-align:center;"><div class="feature-icon icon-purple" style="margin:0 auto 16px;">&#x2605;</div><h3>Fullständig licens</h3><p>Jednorazowy zakup lub subskrypcja przez Microsoft Store. Nieograniczone przetwarzanie AI i wszystkie przyszłe aktualizacje.</p></div></div><div style="margin-top:28px;"><a href="https://apps.microsoft.com/detail/9N3P5FLW85X8" class="download-btn" target="_blank" rel="noopener noreferrer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>Hämta från Microsoft Store</a></div></div></section>
<section style="background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);"><div class="container"><div class="section-label" style="text-align:center;"><span class="overline">Betrodd av användare</span><div class="divider"></div><h2>Vad folk säger</h2></div><div class="features-grid" style="grid-template-columns:repeat(3,1fr);margin-top:32px;"><div class="feature-card"><div style="color:#F5A623;font-size:14px;margin-bottom:8px;">&#x2605;&#x2605;&#x2605;&#x2605;&#x2605;</div><p style="font-size:14px;color:var(--fg-muted);font-style:italic;margin-bottom:12px;">&ldquo;Przywróciłem zdjęcie ślubne moich dziadków z 1942 roku. Koloryzacja AI ożywiła je w sposób, który wydawał mi się niemożliwy. Moja mama płakała, gdy je zobaczyła.&rdquo;</p><p style="font-size:13px;font-weight:700;color:var(--fg);">— Sarah M.</p><p style="font-size:12px;color:var(--fg-subtle);">Historyk rodzinny, Oregon</p></div><div class="feature-card"><div style="color:#F5A623;font-size:14px;margin-bottom:8px;">&#x2605;&#x2605;&#x2605;&#x2605;&#x2605;</div><p style="font-size:14px;color:var(--fg-muted);font-style:italic;margin-bottom:12px;">&ldquo;Jako fotograf byłem sceptyczny wobec narzędzi AI offline. PhotoRestore Pro dorównuje jakości usług chmurowych — a zdjęcia moich klientów nigdy nie opuszczają mojego stanowiska.&rdquo;</p><p style="font-size:13px;font-weight:700;color:var(--fg);">— David K.</p><p style="font-size:12px;color:var(--fg-subtle);">Fotograf portretowy, Londyn</p></div><div class="feature-card"><div style="color:#F5A623;font-size:14px;margin-bottom:8px;">&#x2605;&#x2605;&#x2605;&#x2605;&#x2605;</div><p style="font-size:14px;color:var(--fg-muted);font-style:italic;margin-bottom:12px;">&ldquo;Dodałem znaki wodne do 50 zdjęć produktów w mniej niż minutę. Interfejs jest tak intuicyjny — nie potrzebowałem samouczka.&rdquo;</p><p style="font-size:13px;font-weight:700;color:var(--fg);">— Anna R.</p><p style="font-size:12px;color:var(--fg-subtle);">Wł
